<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuvio Stream Explorer | Universal API Dashboard</title>
    <meta name="description" content="Universal Multi-Provider Stream Extractor and JSON Explorer for Movies, Series, and Anime. Powered by Nuvio Engine with 61 scrapers.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- HLS.js for Video Playing -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Glow Elements -->
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
    <div class="glow-sphere sphere-3"></div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="nav-container">
            <div class="logo-group">
                <div class="logo-icon">
                    <i data-lucide="zap" class="icon-pulse"></i>
                </div>
                <div class="logo-text">
                    <h1>Nuvio <span>Explorer</span></h1>
                    <span class="badge">v2.0 • 61 Providers</span>
                </div>
            </div>
            <div class="nav-controls">
                <div class="status-indicator tooltip" data-tooltip="Backend API Ready">
                    <span class="status-dot"></span>
                    <span class="status-label" id="backend-status-text">Connected</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Hero Search Section -->
        <section class="hero-section">
            <div class="hero-header">
                <h2>Universal Stream & JSON Inspector</h2>
                <p>Query 61 automated scrapers instantly. Extract 4K, 1080p, and multi-audio links for any IMDb or TMDB ID with proxy fallback.</p>
            </div>

            <div class="query-card glass-panel">
                <form id="scrape-form" class="query-form">
                    <!-- Media Type Selector -->
                    <div class="type-selector">
                        <label class="type-option active">
                            <input type="radio" name="media-type" value="movie" checked>
                            <i data-lucide="film"></i>
                            <span>Movie</span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="media-type" value="series">
                            <i data-lucide="tv"></i>
                            <span>Series</span>
                        </label>
                        <label class="type-option">
                            <input type="radio" name="media-type" value="anime">
                            <i data-lucide="sparkles"></i>
                            <span>Anime</span>
                        </label>
                    </div>

                    <!-- ID Input Group -->
                    <div class="input-row">
                        <div class="input-group flex-grow">
                            <label for="media-id" class="input-label">IMDb or TMDB ID</label>
                            <div class="input-wrapper">
                                <i data-lucide="search" class="input-icon"></i>
                                <input type="text" id="media-id" name="media-id" placeholder="e.g. tt5607616, tt0816692, 157336..." required autocomplete="off">
                                <button type="button" id="btn-clear-id" class="btn-clear hidden">
                                    <i data-lucide="x"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Episode Controls (Hidden by default for movies) -->
                        <div id="episode-controls" class="episode-controls hidden">
                            <div class="input-group small-input">
                                <label for="season-num" class="input-label">Season</label>
                                <input type="number" id="season-num" name="season-num" value="1" min="1" max="50">
                            </div>
                            <div class="input-group small-input">
                                <label for="episode-num" class="input-label">Episode</label>
                                <input type="number" id="episode-num" name="episode-num" value="1" min="1" max="2000">
                            </div>
                        </div>
                    </div>

                    <!-- Dual Submit Buttons for Primary & Backup Engines -->
                    <div class="form-actions dual-submit">
                        <button type="button" id="btn-submit-render" class="engine-card-btn engine-render" onclick="triggerScrape('render')">
                            <div class="engine-btn-icon">
                                <i data-lucide="zap"></i>
                            </div>
                            <div class="engine-btn-text">
                                <span class="engine-btn-title">⚡ Get Links (Primary Render)</span>
                                <span class="engine-btn-subtitle">Cloud Engine • 61 Providers • 4K & Multi-Audio</span>
                            </div>
                            <div class="spinner hidden"></div>
                        </button>
                        <button type="button" id="btn-submit-netlify" class="engine-card-btn engine-netlify" onclick="triggerScrape('netlify')">
                            <div class="engine-btn-icon">
                                <i data-lucide="shield-check"></i>
                            </div>
                            <div class="engine-btn-text">
                                <span class="engine-btn-title">🛡️ Get Links (Backup Netlify)</span>
                                <span class="engine-btn-subtitle">Serverless API • High Availability • Instant Proxy</span>
                            </div>
                            <div class="spinner hidden"></div>
                        </button>
                    </div>
                </form>

                <!-- Quick Test Chips -->
                <div class="quick-chips">
                    <span class="chips-label"><i data-lucide="flame"></i> Quick Tests:</span>
                    <button type="button" class="chip" data-id="tt0816692" data-type="movie">
                        <span>🚀 Interstellar (Movie)</span>
                    </button>
                    <button type="button" class="chip" data-id="tt5607616" data-type="anime" data-s="1" data-e="1">
                        <span>👺 Re:Zero (Anime S1E1)</span>
                    </button>
                    <button type="button" class="chip" data-id="tt29583160" data-type="anime" data-s="1" data-e="1">
                        <span>🗡️ Solo Leveling (Anime S1E1)</span>
                    </button>
                    <button type="button" class="chip" data-id="tt0903747" data-type="series" data-s="1" data-e="1">
                        <span>🧪 Breaking Bad (Series S1E1)</span>
                    </button>
                </div>
            </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Built with ❤️ for High-Performance Stream Extraction • <a href="https://github.com/lakshman-reddy-sudo/entertainment" target="_blank" rel="noopener">GitHub Repository</a></p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
